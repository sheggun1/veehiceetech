<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">VICORA CBT desktop examination management dashboard displayed on a laptop</title>
<desc id="desc">A modern dark navy and teal desktop dashboard with navigation sidebar, examination statistics, candidate activity chart, upcoming examinations and a laptop frame.</desc>
<defs>
 <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#102b49"/><stop offset="1" stop-color="#071629"/></linearGradient>
 <linearGradient id="teal" x2="1" y2="1"><stop stop-color="#43e0c6"/><stop offset="1" stop-color="#159b9b"/></linearGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#d9e1ea"/><stop offset=".35" stop-color="#8d9baa"/><stop offset="1" stop-color="#4c5a69"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="22"/></filter>
 <clipPath id="display"><rect x="174" y="86" width="1092" height="748" rx="22"/></clipPath>
</defs>
<ellipse cx="720" cy="914" rx="570" ry="35" fill="#000" opacity=".42" filter="url(#shadow)"/>
